<title>Cone of Diffraction</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#0b1018;
    --panel:#121a29;
    --panel-2:#182234;
    --rule:#26314a;
    --ink:#e6ecf8;
    --ink-dim:#8b97b0;
    --ink-faint:#5d6880;
    --surface:#1f3b73;
    --facet:#2d5aa8;
    --incident:#8fa3c8;
    --order:#4dc4ff;
    --blaze:#ffc233;
    --evanescent:#ff5470;
    --cone:#4a5670;
    --axis:#6b7794;
    --zero:#95a2bb;
    color-scheme: dark;
  }
  html,body{height:100%;}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:14px; -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  #app{
    height:100%; display:flex; flex-direction:column;
  }
  #left{flex:1 1 auto; display:flex; flex-direction:column; min-height:0;}
  #striphost{
    flex:0 0 auto; background:#070c14; border-top:1px solid var(--rule);
  }
  #strip{display:block; width:100%; height:178px;}
  /* -- stage ---------------------------------------------------------- */
  #stage{
    position:relative; flex:1 1 auto; min-height:44vh;
    background:
      radial-gradient(120% 90% at 50% 12%, #16203300 0%, #070b12 100%),
      var(--ground);
    touch-action:none; cursor:grab; overflow:hidden;
  }
  #stage.dragging{cursor:grabbing;}
  #sky{display:block; width:100%; height:100%;}
  .stamp{
    position:absolute; left:16px; top:16px; pointer-events:none;
    display:flex; flex-direction:column; gap:2px;
  }
  .stamp h1{
    margin:0; font-size:13px; font-weight:600; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink);
  }
  .stamp p{
    margin:0; font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:11px; color:var(--ink-faint); letter-spacing:.02em;
  }
  .thesis{
    position:absolute; right:16px; top:16px; pointer-events:none;
    display:flex; gap:22px; font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-variant-numeric:tabular-nums; text-align:right;
  }
  .thesis div{display:flex; flex-direction:column; gap:3px;}
  .thesis .k{font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint);}
  .thesis .v{font-size:19px; color:var(--ink); line-height:1;}
  .thesis .v.fan{color:var(--order);}
  .caption{
    position:absolute; left:16px; right:16px; bottom:12px; pointer-events:none;
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px;
    color:var(--ink-faint); line-height:1.55;
  }
  .caption b{color:var(--ink-dim); font-weight:400;}

  /* -- rim reveal ------------------------------------------------------ */
  #reveal{
    position:absolute; left:50%; transform:translateX(-50%); bottom:64px;
    display:flex; align-items:center; gap:12px;
    padding:9px 14px 9px 16px; border-radius:999px;
    background:#0f1725e6; border:1px solid var(--rule);
    backdrop-filter:blur(8px);
  }
  #reveal label{
    font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-dim); white-space:nowrap;
  }
  #reveal .mag{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px;
    color:var(--order); font-variant-numeric:tabular-nums; min-width:46px; text-align:right;
  }
  #reveal.off{opacity:.45;}
  #reveal.off .mag{color:var(--ink-faint);}

  /* -- controls -------------------------------------------------------- */
  #rail{
    flex:0 0 auto; background:var(--panel); border-top:1px solid var(--rule);
    display:flex; flex-direction:column; gap:0; max-height:52vh; overflow-y:auto;
  }
  .views{
    display:flex; gap:6px; padding:12px 16px; border-bottom:1px solid var(--rule);
    overflow-x:auto; scrollbar-width:none;
    position:sticky; top:0; z-index:2; background:var(--panel);
  }
  .views::-webkit-scrollbar{display:none;}
  .views button{
    flex:0 0 auto; appearance:none; border:1px solid var(--rule); background:var(--panel-2);
    color:var(--ink-dim); font:inherit; font-size:11.5px; padding:6px 12px;
    border-radius:6px; cursor:pointer; white-space:nowrap;
  }
  .views button:hover{color:var(--ink); border-color:#33405e;}
  .views button[aria-pressed="true"]{background:var(--surface); border-color:var(--facet); color:#fff;}
  .views button:focus-visible{outline:2px solid var(--order); outline-offset:2px;}

  .knobs{
    display:grid; grid-template-columns:1fr; gap:14px; padding:14px 16px;
    border-bottom:1px solid var(--rule);
  }
  .knob{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px;}
  .knob .name{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px;
    color:var(--ink-dim); width:74px; letter-spacing:.02em;
  }
  .knob .val{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px;
    color:var(--ink); font-variant-numeric:tabular-nums; width:82px; text-align:right;
  }
  .seg{display:flex; gap:0; border:1px solid var(--rule); border-radius:6px; overflow:hidden;}
  .seg button{
    flex:1 1 0; appearance:none; border:none; background:var(--panel-2);
    color:var(--ink-dim); font:inherit; font-size:11.5px; padding:5px 0; cursor:pointer;
  }
  .seg button + button{border-left:1px solid var(--rule);}
  .seg button[aria-pressed="true"]{background:var(--surface); color:#fff;}
  .seg button:focus-visible{outline:2px solid var(--order); outline-offset:-2px;}

  input[type=range]{
    appearance:none; width:100%; height:20px; background:transparent; margin:0; cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{height:2px; background:var(--rule); border-radius:2px;}
  input[type=range]::-moz-range-track{height:2px; background:var(--rule); border-radius:2px;}
  input[type=range]::-webkit-slider-thumb{
    appearance:none; width:15px; height:15px; margin-top:-6.5px; border-radius:50%;
    background:var(--ink); border:none;
  }
  input[type=range]::-moz-range-thumb{
    width:15px; height:15px; border-radius:50%; background:var(--ink); border:none;
  }
  input[type=range]:focus-visible{outline:2px solid var(--order); outline-offset:4px; border-radius:4px;}

  .orders{padding:12px 16px 18px;}
  .orders h2{
    margin:0 0 9px; font-size:10px; letter-spacing:.13em; text-transform:uppercase;
    color:var(--ink-faint); font-weight:500;
  }
  table{width:100%; border-collapse:collapse; font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:12px; font-variant-numeric:tabular-nums;}
  th{
    text-align:right; font-weight:400; font-size:9.5px; letter-spacing:.09em;
    text-transform:uppercase; color:var(--ink-faint); padding:0 0 6px; border-bottom:1px solid var(--rule);
  }
  th:first-child{text-align:left;}
  td{padding:4px 0; color:var(--ink-dim); text-align:right;}
  td:first-child{text-align:left; color:var(--ink);}
  tr.ev td{color:var(--ink-faint);}
  tr.ev td:first-child{color:var(--evanescent);}
  tr.bl td:first-child{color:var(--blaze);}
  tr.z td:first-child{color:var(--zero);}
  .swatch{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:7px; vertical-align:1px;}
  th.barh{width:42%;}
  td.bar{padding-left:10px;}
  .track{height:6px; background:#1b2436; border-radius:2px; overflow:hidden;}
  .fill{height:100%; border-radius:2px; transition:width .18s ease;}
  @media (max-width:559px){ .narrow-hide{display:none;} }
  .more{margin:8px 0 0; font-size:10.5px; color:var(--ink-faint); font-family:"IBM Plex Mono",ui-monospace,monospace;}

  /* -- provenance: a validity limit and an expected deviation must not
        look alike, so level drives the mark, not just the colour -------- */
  .prov{padding:12px 16px 20px; border-top:1px solid var(--rule);}
  .prov h2{
    margin:0 0 9px; font-size:10px; letter-spacing:.13em; text-transform:uppercase;
    color:var(--ink-faint); font-weight:500;
  }
  .pitem{
    display:grid; grid-template-columns:auto 1fr; gap:9px;
    padding:8px 0; border-bottom:1px solid #1b2436;
  }
  .pitem:last-child{border-bottom:none;}
  .pmark{
    width:15px; height:15px; border-radius:3px; display:grid; place-items:center;
    font-size:10px; font-weight:600; line-height:1; margin-top:1px;
  }
  .pitem.limit .pmark{background:#4a3208; color:#ffc233; border:1px solid #6d4a0c;}
  .pitem.expected .pmark{background:#152c46; color:#4dc4ff; border:1px solid #1e4066;}
  .pitem.note .pmark{background:#1b2436; color:var(--ink-faint); border:1px solid #26314a;}
  .ptitle{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px;
    color:var(--ink); margin:0 0 3px; font-variant-numeric:tabular-nums;
  }
  .pitem.limit .ptitle{color:var(--blaze);}
  .pbody{margin:0; font-size:11.5px; line-height:1.5; color:var(--ink-dim);}
  .vflag{
    display:none; width:7px; height:7px; border-radius:50%;
    background:var(--blaze); margin-left:6px; vertical-align:2px;
  }
  .vflag.on{display:inline-block;}

  @media (min-width:900px){
    #app{flex-direction:row;}
    #left{min-width:0;}
    #stage{min-height:0;}
    #rail{
      flex:0 0 340px; max-height:none; border-top:none; border-left:1px solid var(--rule);
      padding-bottom:env(safe-area-inset-bottom,0px);
    }
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>

<div id="app">
  <div id="left">
  <div id="stage">
    <canvas id="sky"></canvas>
    <div class="stamp">
      <h1>Cone of Diffraction</h1>
      <p>extreme off-plane mount &middot; grazing incidence</p>
    </div>
    <div class="thesis">
      <div class="narrow-hide"><span class="k">polar spread</span><span class="v" id="t-polar">0.00&deg;</span></div>
      <div><span class="k">azimuth fan</span><span class="v fan" id="t-fan">93.8&deg;</span></div>
      <div><span class="k">&Sigma; E</span><span class="v"><span id="t-sum">&mdash;</span><span class="vflag" id="t-flag"></span></span></div>
    </div>
    <div id="reveal">
      <label for="rim">Rim focus</label>
      <input type="range" id="rim" min="0" max="1000" value="0" style="width:132px">
      <span class="mag" id="magv">1.0&times;</span>
    </div>
    <p class="caption" id="cap"></p>
  </div>
  <div id="striphost" hidden>
    <canvas id="strip"></canvas>
  </div>
  </div>

  <div id="rail">
    <div class="views" id="views"></div>

    <div class="knobs">
      <div class="knob">
        <span class="name">coating</span>
        <div class="seg" id="coatseg">
          <button type="button" data-v="0">none</button>
          <button type="button" data-v="1">Au</button>
        </div>
        <span class="val" id="v-coat"></span>
      </div>
      <div class="knob">
        <span class="name">&gamma; half-cone</span>
        <input type="range" id="k-gamma" min="0" max="1000" value="0">
        <span class="val" id="v-gamma"></span>
      </div>
      <div class="knob">
        <span class="name">&alpha; azimuth</span>
        <input type="range" id="k-alpha" min="-800" max="800" value="250">
        <span class="val" id="v-alpha"></span>
      </div>
      <div class="knob">
        <span class="name">&lambda; wavelength</span>
        <input type="range" id="k-lambda" min="30" max="3000" value="300">
        <span class="val" id="v-lambda"></span>
      </div>
      <div class="knob">
        <span class="name">band</span>
        <input type="range" id="k-band" min="0" max="1000" value="0">
        <span class="val" id="v-band"></span>
      </div>
      <div class="knob">
        <span class="name">p period</span>
        <input type="range" id="k-period" min="1000" max="12000" value="3152">
        <span class="val" id="v-period"></span>
      </div>
      <div class="knob">
        <span class="name">&delta; blaze</span>
        <input type="range" id="k-blaze" min="0" max="450" value="295">
        <span class="val" id="v-blaze"></span>
      </div>
    </div>

    <div class="orders">
      <h2>Orders &middot; scalar efficiency</h2>
      <table>
        <thead><tr><th>m</th><th>&beta;</th><th>E</th><th class="barh"></th></tr></thead>
        <tbody id="obody"></tbody>
      </table>
      <p class="more" id="more"></p>
    </div>

    <div class="prov">
      <h2>Provenance</h2>
      <div id="provlist"></div>
    </div>
  </div>
</div>

<script>

  "use strict";

  // ---- conventions.md section 3 -------------------------------------
  // d-hat = +x (dispersion, across the grooves)
  // n-hat = +y (surface normal)
  // g-hat = -z (groove axis); the cone opens along -g-hat = +z
  // k-hat(beta) = (sin g sin b, sin g cos b, cos g)
  // k-hat_i     = (-sin g sin a, -sin g cos a, cos g)   travels toward the grating

  var RAD = Math.PI/180, DEG = 180/Math.PI;
  var PATCH_SPAN = 0.34, FRAME_HALF = 0.62, RIM_MARGIN = 1.6, MIN_RIM_MAG = 1.5;
  var MAX_DRAWN = 81, MAX_LABELS = 7;

  var S = {
    period:315.15, alpha:25, gamma:1.5, lambda:3, blaze:29.5, band:0, coating:true,
    yaw:26.6, pitch:20.4, rim:0, spin:0
  };

  // The illuminated band, as a fraction of the centre wavelength.
  // band = 0 is monochromatic; band = 1 runs lambda/2 to 3 lambda/2.
  function bandRange(){
    var h = S.band/2;
    return [S.lambda*(1-h), S.lambda*(1+h)];
  }

  var cv = document.getElementById("sky"), ctx = cv.getContext("2d");
  var stage = document.getElementById("stage");
  var W=0, H=0, DPR=1;

  function measure(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = stage.clientWidth; H = stage.clientHeight;
    cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
    cv.style.width = W+"px"; cv.style.height = H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  function resize(){ measure(); draw(); }

  // ---- physics -------------------------------------------------------
  function sinBeta(m, lam){
    var L = (lam == null) ? S.lambda : lam;
    return m*L/(S.period*Math.sin(S.gamma*RAD)) - Math.sin(S.alpha*RAD);
  }
  function propagating(s){ return Math.abs(s) <= 1; }

  function orderRange(lam){
    var L = (lam == null) ? S.lambda : lam;
    var scale = S.period*Math.sin(S.gamma*RAD)/L;
    var sa = Math.sin(S.alpha*RAD);
    var lo = Math.ceil((sa-1)*scale), hi = Math.floor((sa+1)*scale);
    // guard the closed-interval endpoints against float drift
    while(lo<=hi && !propagating(sinBeta(lo,L))) lo++;
    while(hi>=lo && !propagating(sinBeta(hi,L))) hi--;
    return [lo,hi];
  }

  // blaze wavelength: m*lb = 2 p sin(zeta) sin(delta), sin zeta = sin g cos(delta - alpha)
  function blazeOrder(lo,hi){
    if(S.blaze <= 0.001) return null;
    var sz = Math.sin(S.gamma*RAD)*Math.cos((S.blaze-S.alpha)*RAD);
    var num = 2*S.period*sz*Math.sin(S.blaze*RAD);
    var best=null, bestd=Infinity;
    for(var m=lo;m<=hi;m++){
      if(m===0) continue;
      var d = Math.abs(num/m - S.lambda);
      if(d<bestd){bestd=d; best=m;}
    }
    return best;
  }

    while(hi-lo > 1){ mid = (lo+hi) >> 1; if(wl[mid] <= lam) lo = mid; else hi = mid; }
    var span = wl[hi]-wl[lo];
    var f = span > 0 ? (lam-wl[lo])/span : 0;
    var d = AU.d[lo] + (AU.d[hi]-AU.d[lo])*f;
    var b = AU.b[lo] + (AU.b[hi]-AU.b[lo])*f;
    return {d:d, b:b, nRe:1-d, nIm:b, critical:Math.sqrt(2*d)};
  }

  // ---- complex arithmetic, only as much as Fresnel needs ---------------
  // Principal branch, Re >= 0. The branch is load-bearing: the transmitted wave
  // has to decay into the material, so Im k2 must not come back negative.
  function csqrt(a,b){
    var r = Math.hypot(a,b);
    var re = Math.sqrt(Math.max(0,(r+a)/2));
    var im = Math.sqrt(Math.max(0,(r-a)/2));
    return [re, b < 0 ? -im : im];
  }
  function cdiv(ar,ai,br,bi){
    var d = br*br + bi*bi;
    return [(ar*br+ai*bi)/d, (ai*br-ar*bi)/d];
  }

  // materials/fresnel.amplitude, with roughness left out (Problem.roughness
  // defaults to 0 and this prototype has no roughness knob).
  //   k1 = sin(zeta),  k2 = sqrt(n^2 - cos^2 zeta)
  //   r_s = (k1-k2)/(k1+k2),  r_p = (n^2 k1 - k2)/(n^2 k1 + k2)
  // zeta is measured FROM THE SURFACE, matching geometry.facet_graze, so the
  // two compose without a conversion.
  function amplitude(nRe,nIm,graze){
    var k1 = Math.sin(graze), c = Math.cos(graze);
    var n2r = nRe*nRe - nIm*nIm, n2i = 2*nRe*nIm;
    var k2 = csqrt(n2r - c*c, n2i);
    var rs = cdiv(k1-k2[0], -k2[1], k1+k2[0], k2[1]);
    var pr = n2r*k1, pi = n2i*k1;
    var rp = cdiv(pr-k2[0], pi-k2[1], pr+k2[0], pi+k2[1]);
    return [rs, rp];
  }

  // ---- profiles.Blazed -----------------------------------------------
  // depth = 1/(cot b + cot a) in units of the period, apex = cot b/(cot b + cot a).
  // Anti-blaze is held at 90 deg here, so apex = 1 and depth = tan(blaze):
  // a ramp across the whole period closed by a vertical facet at t = 1.
  function heightNm(t){
    return S.period*Math.tan(S.blaze*RAD)*t;
  }

  // _facet_tilt: tan(delta) = +dy/dt in NORMALISED units. Blazed with a
  // vertical anti-blaze facet refuses an analytic slope, so this is the
  // periodic central difference the solver falls back to. The sign is the
  // whole content of it -- the other one also looks like an angle.
  function tiltArray(N){
    var tb = Math.tan(S.blaze*RAD), h = new Float64Array(N), tilt = new Float64Array(N), i;
    for(i=0;i<N;i++) h[i] = tb*(i/N);
    for(i=0;i<N;i++){
      var up = h[(i+1)%N], dn = h[(i-1+N)%N];
      tilt[i] = Math.atan((up-dn)*N/2);
    }
    return tilt;
  }

  // ---- solvers/scalar.py, the uncoated path ---------------------------
  //   G_m   = mean_j exp(i phi_m(t_j)) exp(-2 pi i m t_j)
  //   phi_m = (2 pi / lambda) g(t) sin(gamma) [cos(alpha) + cos(beta_m)]
  //   E_m   = O_m |G_m|^2,  O_m = 4 ca cb / (ca + cb)^2
  // The obliquity is the SYMMETRIC one, so reciprocity survives. The sum over
  // orders is reported and never renormalised -- that deviation is the model's
  // own error signal, and rescaling it away is what Appendix D got wrong.
  function scalarEfficiency(marks, lam, quadHint){
    var L = (lam == null) ? S.lambda : lam;
    var i, j, maxOrder = 0;
    for(i=0;i<marks.length;i++){
      if(marks[i].prop) maxOrder = Math.max(maxOrder, Math.abs(marks[i].m));
    }
    var N = quadHint || 1024;
    while(N <= 2*maxOrder && N < 8192) N *= 2;     // Nyquist, as solve() checks

    var ca = Math.cos(S.alpha*RAD), sg = Math.sin(S.gamma*RAD);
    var k2 = 2*Math.PI/L;
    var tt = new Float64Array(N), phase = new Float64Array(N);
    for(j=0;j<N;j++){ tt[j] = j/N; phase[j] = k2*heightNm(tt[j])*sg; }

    // With a coating, reflection is resolved across the groove cycle and
    // carried INSIDE the integral, which is what makes it order-dependent.
    // reflectivity_model="local", visibility="facet-normal".
    var coat = S.coating ? auAt(L) : null;
    var tilt = null, wIn = null, sqInS = null, sqInP = null, alphaR = S.alpha*RAD;
    var shadowed = 0, gmin = Infinity, gmax = -Infinity, suppressed = [];
    if(coat){
      tilt = tiltArray(N);
      wIn = new Float64Array(N);
      sqInS = new Float64Array(2*N); sqInP = new Float64Array(2*N);
      for(j=0;j<N;j++){
        // sin zeta = sin(gamma) cos(tilt - angle), unclipped: a negative value
        // is the facet turned away, which is information, not an error.
        var si = sg*Math.cos(tilt[j] - alphaR);
        wIn[j] = si > 0 ? 1 : 0;
        if(si > 0){
          var gg = Math.asin(Math.min(1,si));
          if(gg < gmin) gmin = gg;
          if(gg > gmax) gmax = gg;
        } else shadowed++;
        var gz = Math.asin(Math.max(-1,Math.min(1,si)));
        var ai = amplitude(coat.nRe, coat.nIm, gz);
        var qs = csqrt(ai[0][0], ai[0][1]), qp = csqrt(ai[1][0], ai[1][1]);
        sqInS[2*j]=qs[0]; sqInS[2*j+1]=qs[1];
        sqInP[2*j]=qp[0]; sqInP[2*j+1]=qp[1];
      }
    }

    var emax = 0, sum = 0;
    for(i=0;i<marks.length;i++){
      var mk = marks[i];
      if(!mk.prop){ mk.eff = null; continue; }
      if(S.coating && !coat){ mk.eff = null; continue; }   // never extrapolate
      var cb = Math.cos(mk.beta), f = ca + cb, w = 2*Math.PI*mk.m;
      var ob = 4*ca*cb/(f*f);

      if(!coat){
        var re = 0, im = 0;
        for(j=0;j<N;j++){
          var a = phase[j]*f - w*tt[j];
          re += Math.cos(a); im += Math.sin(a);
        }
        mk.eff = ob*(re*re + im*im)/(N*N);
      }else{
        // E_m = O_m/2 ( |mean w_s e^{i Phi} e^{-2 pi i m t}|^2 + same for p ),
        // with w = sqrt(r(zeta_in)) sqrt(r(zeta_out)) -- the geometric mean,
        // which is symmetric in alpha <-> beta_m and so keeps reciprocity.
        // Plain r(zeta_in) depends on alpha alone and breaks it by 82%.
        var sr=0, si2=0, pr=0, pi2=0, anyLit = false;
        for(j=0;j<N;j++){
          if(wIn[j] <= 0) continue;
          var so = sg*Math.cos(tilt[j] - mk.beta);
          if(so <= 0) continue;                       // coverage = min(in, out)
          anyLit = true;
          var ao = amplitude(coat.nRe, coat.nIm, Math.asin(Math.min(1,so)));
          var os = csqrt(ao[0][0], ao[0][1]), op = csqrt(ao[1][0], ao[1][1]);
          var isr = sqInS[2*j], isi = sqInS[2*j+1];
          var ipr = sqInP[2*j], ipi = sqInP[2*j+1];
          var wsr = isr*os[0] - isi*os[1], wsi = isr*os[1] + isi*os[0];
          var wpr = ipr*op[0] - ipi*op[1], wpi = ipr*op[1] + ipi*op[0];
          var ang = phase[j]*f - w*tt[j];
          var cr = Math.cos(ang), ci = Math.sin(ang);
          sr  += wsr*cr - wsi*ci;  si2 += wsr*ci + wsi*cr;
          pr  += wpr*cr - wpi*ci;  pi2 += wpr*ci + wpi*cr;
        }
        if(!anyLit) suppressed.push(mk.m);
        mk.eff = ob*0.5*((sr*sr + si2*si2) + (pr*pr + pi2*pi2))/(N*N);
      }
      if(mk.eff > emax) emax = mk.eff;
      sum += mk.eff;
    }
    return {emax:emax, sum:sum, N:N, coat:coat,
            outside:(S.coating && !coat) ? L : null,
            shadowFrac: coat ? shadowed/N : 0,
            grazeMin: isFinite(gmin) ? gmin : null,
            grazeMax: isFinite(gmax) ? gmax : null,
            suppressed: suppressed};
  }

  function scene(){
    var r = orderRange(), lo=r[0], hi=r[1];
    var live = hi-lo+1;
    if(live<0) live=0;
    var bl = live>0 ? blazeOrder(lo,hi) : null;
    var marks=[], i;
    // pad two evanescent each side, as order_span does
    var a = lo-2, b = hi+2;
    var step = 1, total = b-a+1;
    if(total > MAX_DRAWN) step = Math.ceil(total/MAX_DRAWN);
    for(i=a;i<=b;i+=step){
      var s = sinBeta(i), p = propagating(s);
      marks.push({m:i, s:s, beta:p?Math.asin(s):null, prop:p, blaze:(i===bl)});
    }
    var fan = 0;
    if(live>1){
      var b1 = Math.asin(Math.max(-1,Math.min(1,sinBeta(lo))));
      var b2 = Math.asin(Math.max(-1,Math.min(1,sinBeta(hi))));
      fan = Math.abs(b2-b1)*DEG;
    }

    // The integral is per order, so a scan with hundreds of them is not a
    // realtime calculation. Say so rather than quietly drawing every ray alike.
    var eff = null;
    if(live > 0 && live <= MAX_DRAWN) eff = scalarEfficiency(marks);

    return {marks:marks, lo:lo, hi:hi, live:live, fan:fan, blaze:bl,
            step:step, eff:eff, spec:spectrum()};
  }

  // ---- the band, order by order ---------------------------------------
  // sin beta depends on m and lambda only through their product, so order m at
  // lambda and order m+1 at m.lambda/(m+1) leave along the SAME direction.
  // That is order overlap, and it is why a broadband source needs a filter or
  // a detector that can tell the two apart.
  var SPEC_NL = 44, SPEC_QUAD = 256, SPEC_MAX_ORDERS = 60;

  function spectrum(){
    if(S.band <= 0.002) return null;
    var r = bandRange(), l1 = r[0], l2 = r[1];
    var span = orderRange(l1);                 // the widest set is at the short end
    var lo = span[0], hi = span[1];
    if(hi < lo) return null;
    if(hi-lo+1 > SPEC_MAX_ORDERS) return {tooMany:hi-lo+1};

    var rows = [], i, j;
    for(i=lo;i<=hi;i++) rows.push({m:i, pts:[]});

    var emax = 0, nOutside = 0;
    for(i=0;i<SPEC_NL;i++){
      var lam = l1 + (l2-l1)*i/(SPEC_NL-1);
      var marks = [];
      for(j=0;j<rows.length;j++){
        var s = sinBeta(rows[j].m, lam), p = propagating(s);
        marks.push({m:rows[j].m, s:s, beta:p?Math.asin(s):null, prop:p});
      }
      var res = scalarEfficiency(marks, lam, SPEC_QUAD);
      if(res.outside != null) nOutside++;
      for(j=0;j<rows.length;j++){
        var mk = marks[j];
        rows[j].pts.push(mk.prop ? {lam:lam, beta:mk.beta, eff:mk.eff} : null);
        if(mk.prop && mk.eff > emax) emax = mk.eff;
      }
    }
    rows = rows.filter(function(rw){
      return rw.pts.some(function(p){ return p !== null; });
    });
    // Peak efficiency decides which orders earn a lane. Taking the first few by
    // index would hand the lanes to whichever orders happen to sit lowest.
    for(i=0;i<rows.length;i++){
      var pk = 0;
      for(j=0;j<rows[i].pts.length;j++){
        if(rows[i].pts[j] && rows[i].pts[j].eff > pk) pk = rows[i].pts[j].eff;
      }
      rows[i].peak = pk;
    }
    return {l1:l1, l2:l2, rows:rows, emax:emax, outside:nOutside, nl:SPEC_NL};
  }

  // short -> long, using the palette the rest of the page already speaks
  function ramp(u){
    var c1=[111,125,255], c2=[77,196,255], c3=[255,194,51], a, b, t;
    u = Math.max(0, Math.min(1, u));
    if(u < 0.5){ a=c1; b=c2; t=u/0.5; } else { a=c2; b=c3; t=(u-0.5)/0.5; }
    return "rgb("+Math.round(a[0]+(b[0]-a[0])*t)+","+
                  Math.round(a[1]+(b[1]-a[1])*t)+","+
                  Math.round(a[2]+(b[2]-a[2])*t)+")";
  }

  // ---- provenance, from ScalarSolver._provenance ----------------------
  // Two of its guards apply to an uncoated, smooth, unpolarized run, and they
  // mean opposite things. The reduced ratio is the model being pushed outside
  // what it can answer for. The energy deviation is the model working as
  // designed, and is reported rather than rescaled because it is the error
  // signal. Collapsing them into one "warning" colour would lose that.
  var REDUCED_RATIO_WARN = 0.1;

  function provenance(sc){
    var out = [], lamMax = bandRange()[1];
    var ratio = lamMax/(S.period*Math.sin(S.gamma*RAD));
    if(ratio > REDUCED_RATIO_WARN){
      out.push({level:"limit", mark:"!",
        title:"reduced ratio λ/(p sin γ) = "+fmt(ratio,3),
        body:"Scalar theory needs the wavelength small against the structure, and "+
             "in a conical mount that comparison happens at the reduced wavelength "+
             "λ/sin γ — so accuracy degrades above "+REDUCED_RATIO_WARN+
             " even where λ/p looks safe. Order positions and the blaze envelope "+
             "stay good intuition here; per-order numbers want a rigorous method."});
    }
    if(sc.eff){
      var dev = Math.abs(sc.eff.sum - 1);
      if(dev > 0.01){
        out.push({level:"expected", mark:"Σ",
          title:"ΣE = "+fmt(sc.eff.sum,4)+", "+fmt(100*dev,1)+"% "+
                (sc.eff.sum>1?"above":"below")+" unity",
          body:"Expected. The thin-element approximation for a reflection grating "+
               "does not conserve energy, because the phase depends on the exit "+
               "direction and the coefficients are therefore not a Parseval pair. "+
               "Kept that way because the energy-conserving alternative violates "+
               "Lorentz reciprocity. Reported, never rescaled."});
      }
    }
    var e = sc.eff;
    if(S.coating && sc.spec && sc.spec.outside > 0){
      out.push({level:"limit", mark:"!",
        title:sc.spec.outside+" of "+sc.spec.nl+" band samples outside the Au table",
        body:"Part of the band falls outside "+fmt(AU.wl[0],3)+"–"+
             fmt(AU.wl[AU.wl.length-1],3)+" nm, and those wavelengths carry no "+
             "efficiency rather than an extrapolated one. They still show their "+
             "position, which the grating equation gives without any material."});
    }
    if(S.coating && e && e.outside != null){
      out.push({level:"limit", mark:"!",
        title:"Au is tabulated "+fmt(AU.wl[0],3)+"–"+fmt(AU.wl[AU.wl.length-1],3)+" nm",
        body:"λ = "+fmt(e.outside,3)+" nm is outside it, so no efficiency is "+
             "computed. Extrapolating an optical constant would invent structure the "+
             "data does not have, which is why gratinglab refuses here rather than "+
             "returning a plausible number."});
    }
    if(S.coating && e && e.coat){
      var gmaxDeg = e.grazeMax!=null ? e.grazeMax*DEG : 0;
      var critDeg = e.coat.critical*DEG;
      if(e.grazeMax != null && e.grazeMax > e.coat.critical){
        out.push({level:"limit", mark:"!",
          title:"past total external reflection: "+fmt(gmaxDeg,3)+
                "° > θc "+fmt(critDeg,3)+"°",
          body:"The steepest lit part of the groove sits above the critical angle for "+
               "Au at this wavelength, where reflectivity collapses. That is outside "+
               "the regime a grazing-incidence design operates in."});
      }
      // The waived TE/TM to facet s/p mapping, priced. Free only while s and p
      // are degenerate, which at these grazes they are -- but measured, not assumed.
      var am = amplitude(e.coat.nRe, e.coat.nIm, e.grazeMax!=null?e.grazeMax:0);
      var Rs = am[0][0]*am[0][0]+am[0][1]*am[0][1];
      var Rp = am[1][0]*am[1][0]+am[1][1]*am[1][1];
      var split = Rs>0 ? Math.abs(Rs-Rp)/Rs : 0;
      if(split > 0.02){
        out.push({level:"limit", mark:"!",
          title:"s/p split "+fmt(100*split,2)+"% at "+fmt(gmaxDeg,3)+"°",
          body:"The 50/50 facet s/p average stands in for a groove-TE/TM to facet-s/p "+
               "rotation nobody carries, which is free only while the two are "+
               "degenerate. Read polarization-sensitive conclusions from a rigorous "+
               "method."});
      }
      if(e.suppressed.length){
        out.push({level:"expected", mark:"○",
          title:"order(s) "+e.suppressed.join(", ")+" zero by shadowing",
          body:"No part of the groove faces both the incident and the diffracted "+
               "direction, with "+fmt(100*e.shadowFrac,3)+"% of the period shadowed "+
               "from the beam to begin with. This is geometry, not passing off — "+
               "those orders still propagate."});
      }
      out.push({level:"note", mark:"·",
        title:"Au — absolute, graze "+
              (e.grazeMin!=null ? fmt(e.grazeMin*DEG,3)+"–"+fmt(gmaxDeg,3)+"°" : "—"),
        body:"Reflection is resolved across the groove cycle and carried inside the "+
             "integral, weighted by the geometric mean of the incident and exit "+
             "reflectivities so that reciprocity survives. Roughness is zero and the "+
             "Brewster check is not implemented here."});
    }else if(!S.coating){
      out.push({level:"note", mark:"·",
        title:"uncoated — relative to a perfect reflector",
        body:"No coating is named, so these are not absolute efficiencies. Naming one "+
             "is what turns the normalisation absolute."});
    }
    return out;
  }

  function paintProvenance(sc){
    var items = provenance(sc), host = document.getElementById("provlist");
    host.innerHTML = "";
    var limited = false;
    for(var i=0;i<items.length;i++){
      var it = items[i];
      if(it.level === "limit") limited = true;
      var d = document.createElement("div");
      d.className = "pitem "+it.level;
      d.innerHTML = '<div class="pmark">'+it.mark+'</div>'+
        '<div><p class="ptitle">'+it.title+'</p><p class="pbody">'+it.body+'</p></div>';
      host.appendChild(d);
    }
    // The flag rides with the number, which is the whole point of surfacing it.
    document.getElementById("t-flag").className = "vflag"+(limited?" on":"");
  }

  // Physics changes only when a knob moves; orbiting must not recompute it.
  var CACHE = null;
  function physics(){ if(!CACHE) CACHE = scene(); return CACHE; }
  function invalidate(){ CACHE = null; }

  // ---- camera --------------------------------------------------------
  function cross(a,b){return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];}
  function norm(a){var n=Math.hypot(a[0],a[1],a[2])||1; return [a[0]/n,a[1]/n,a[2]/n];}
  function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}

  var CAM = {right:[1,0,0], up:[0,1,0], fwd:[0,0,-1], target:[0,0,0], zoom:1, px:1};

  function rimMag(){
    var half = RIM_MARGIN*Math.sin(S.gamma*RAD);
    return half>0 ? FRAME_HALF/half : Infinity;
  }

  function updateCamera(){
    var y=S.yaw*RAD, p=Math.max(-88,Math.min(88,S.pitch))*RAD;
    var eye = [Math.sin(y)*Math.cos(p), Math.sin(p), Math.cos(y)*Math.cos(p)];
    var f = [-eye[0],-eye[1],-eye[2]];
    var wup = Math.abs(f[1])>0.999 ? [0,0,1] : [0,1,0];
    var r = norm(cross(f,wup));
    var u = cross(r,f);
    CAM.fwd=f; CAM.right=r; CAM.up=u;

    var t = S.rim;
    var mag = rimMag();
    var usable = mag >= MIN_RIM_MAG && isFinite(mag);
    if(!usable) t = 0;
    var ease = 1-(1-t)*(1-t);              // target settles ahead of the zoom
    // at rest, centre on the middle of the bundle; focused, on the rim itself
    CAM.target = [0,0,(0.46 + 0.54*ease)*Math.cos(S.gamma*RAD)];
    CAM.zoom = usable ? Math.pow(mag, t) : 1;
    CAM.px = Math.min(W,H)/(2*FRAME_HALF) * 0.92 * CAM.zoom;
    CAM.rimUsable = usable;
    CAM.mag = mag;
  }

  function proj(pt){
    var v0=pt[0]-CAM.target[0], v1=pt[1]-CAM.target[1], v2=pt[2]-CAM.target[2];
    var sx = v0*CAM.right[0]+v1*CAM.right[1]+v2*CAM.right[2];
    var sy = v0*CAM.up[0]+v1*CAM.up[1]+v2*CAM.up[2];
    var d  = v0*CAM.fwd[0]+v1*CAM.fwd[1]+v2*CAM.fwd[2];
    return [W/2 + sx*CAM.px, H/2 - sy*CAM.px, d];
  }

  // ---- drawing primitives -------------------------------------------
  function line(a,b,color,width,dash,alpha){
    var p=proj(a), q=proj(b);
    ctx.save();
    ctx.globalAlpha = alpha==null?1:alpha;
    ctx.strokeStyle=color; ctx.lineWidth=width||1; ctx.lineCap="round";
    if(dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke();
    ctx.restore();
  }
  function poly(points,color,width,alpha,close){
    ctx.save();
    ctx.globalAlpha = alpha==null?1:alpha;
    ctx.strokeStyle=color; ctx.lineWidth=width||1; ctx.lineJoin="round";
    ctx.beginPath();
    for(var i=0;i<points.length;i++){
      var p=proj(points[i]);
      if(i===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]);
    }
    if(close) ctx.closePath();
    ctx.stroke(); ctx.restore();
  }
  function quad(a,b,c,d,fill,stroke,alpha){
    var pa=proj(a),pb=proj(b),pc=proj(c),pd=proj(d);
    ctx.save(); ctx.globalAlpha=alpha==null?1:alpha;
    ctx.beginPath();
    ctx.moveTo(pa[0],pa[1]); ctx.lineTo(pb[0],pb[1]);
    ctx.lineTo(pc[0],pc[1]); ctx.lineTo(pd[0],pd[1]); ctx.closePath();
    ctx.fillStyle=fill; ctx.fill();
    if(stroke){ctx.strokeStyle=stroke; ctx.lineWidth=0.75; ctx.stroke();}
    ctx.restore();
  }
  function dotAt(pt,color,r){
    var p=proj(pt);
    ctx.save(); ctx.fillStyle=color;
    ctx.beginPath(); ctx.arc(p[0],p[1],r,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
  function label(pt,text,color,dx,dy,size){
    var p=proj(pt);
    ctx.save();
    ctx.font=(size||11)+'px "IBM Plex Mono", ui-monospace, monospace';
    ctx.fillStyle=color; ctx.textAlign="left"; ctx.textBaseline="middle";
    ctx.shadowColor="#070b12"; ctx.shadowBlur=5;
    ctx.fillText(text, p[0]+(dx||6), p[1]+(dy||0));
    ctx.restore();
  }

  function kvec(beta){
    var sg=Math.sin(S.gamma*RAD);
    return [sg*Math.sin(beta), sg*Math.cos(beta), Math.cos(S.gamma*RAD)];
  }

  // ---- the grating patch (cross-section exact, size a drawing choice) --
  function drawPatch(){
    if(S.rim > 0.55) return;                 // off-frame once focused on the rim
    var fade = 1 - Math.max(0, (S.rim-0.25)/0.30);
    var GROOVES = 6;
    var nm2u = PATCH_SPAN/(GROOVES*S.period);      // nm -> ray-length units
    var depth = S.period*Math.tan(S.blaze*RAD)*nm2u;
    var pu = S.period*nm2u;
    var halfZ = 0.17, x0 = -PATCH_SPAN/2;
    var faces=[];
    for(var g=0; g<GROOVES; g++){
      var xa = x0+g*pu, xb = xa+pu;
      // the rising facet, then the vertical drop
      faces.push([[xa,-depth,-halfZ],[xb,0,-halfZ],[xb,0,halfZ],[xa,-depth,halfZ]]);
      faces.push([[xb,0,-halfZ],[xb,-depth,-halfZ],[xb,-depth,halfZ],[xb,0,halfZ]]);
    }
    faces.sort(function(p,q){
      var dp=0,dq=0,i;
      for(i=0;i<4;i++){dp+=proj(p[i])[2]; dq+=proj(q[i])[2];}
      return dq-dp;                          // far first
    });
    for(var i=0;i<faces.length;i++){
      var f=faces[i];
      // the anti-blaze faces sit in shadow, not in a different material
      quad(f[0],f[1],f[2],f[3], i%2 ? "#16294e" : "#26497f", "#3568b4", 0.9*fade);
    }
  }

  // ---- scene ---------------------------------------------------------
  function draw(){
    var sc = physics();
    // The strip taking or giving back its band changes the stage's height, so
    // re-measure before drawing into it rather than one frame later.
    var wantStrip = !!(sc.spec && !sc.spec.tooMany && sc.spec.rows.length);
    if(host.hidden === wantStrip){
      host.hidden = !wantStrip;
      measure();
    }
    if(!W||!H) return;
    updateCamera();
    ctx.clearRect(0,0,W,H);

    var sg = Math.sin(S.gamma*RAD), cg = Math.cos(S.gamma*RAD);
    var O=[0,0,0], L=1;

    // --- cone surface: straight generators + rim circle
    var NG = 72, i, j;
    for(i=0;i<NG;i++){
      var ph = i/NG*Math.PI*2;
      line(O, [sg*Math.sin(ph)*L, sg*Math.cos(ph)*L, cg*L], "#3d4761", 1, null, 0.30);
    }
    var rimPts=[];
    for(i=0;i<=160;i++){
      var t=i/160*Math.PI*2;
      rimPts.push([sg*Math.sin(t), sg*Math.cos(t), cg]);
    }
    poly(rimPts, "#6b7794", 1.25, 0.8);

    // --- axes
    var AX=0.42;
    line(O,[AX,0,0],"#6b7794",1,[3,4],0.75); label([AX,0,0],"d","#8b97b0",7,0,11);
    line(O,[0,AX,0],"#0a7d28",1.2,null,0.85); label([0,AX,0],"n","#3fbf5e",7,0,11);
    line(O,[0,0,-AX],"#6b7794",1,[3,4],0.75); label([0,0,-AX],"g","#8b97b0",7,0,11);

    drawPatch();

    // --- incident ray, travelling toward the grating
    var ki = [-sg*Math.sin(S.alpha*RAD), -sg*Math.cos(S.alpha*RAD), cg];
    var start = [-ki[0]*L, -ki[1]*L, -ki[2]*L];
    line(start, O, "#8fa3c8", 1.6, null, 0.95);
    // arrowhead, three quarters along
    var mid=[start[0]*0.22, start[1]*0.22, start[2]*0.22];
    dotAt(mid, "#8fa3c8", 2.6);
    label(start, "ki", "#a9bade", 8, -2, 11);

    // --- orders
    var labelled = 0, live = sc.marks.filter(function(m){return m.prop;});
    var labelStep = Math.max(1, Math.ceil(live.length/MAX_LABELS));
    var liveIdx = 0;
    for(i=0;i<sc.marks.length;i++){
      var mk = sc.marks[i];
      if(!mk.prop){
        // evanescent: a stub along the surface plane, so passing-off is visible
        var sgn = mk.s>0?1:-1;
        var stub = [sgn*sg*1.08, 0, cg*0.0];
        dotAt([sgn*sg*1.16, 0.0, cg], "#ff5470", 2.2);
        continue;
      }
      var k = kvec(mk.beta);
      var col = mk.blaze ? "#ffc233" : (mk.m===0 ? "#95a2bb" : "#4dc4ff");
      // Ray weight IS the efficiency: sqrt so a weak order still reads as
      // present rather than vanishing, which would look like passing off.
      var rel = (sc.eff && sc.eff.emax>0 && mk.eff!=null)
        ? Math.sqrt(mk.eff/sc.eff.emax) : 0.62;
      var wid = 0.7 + 3.4*rel;
      line(O, k, col, wid, null, 0.22 + 0.78*rel);
      dotAt(k, col, 1.8 + 3.2*rel);
      if((liveIdx % labelStep === 0 && S.rim > 0.12) || mk.blaze){
        ctx.save();
        ctx.globalAlpha = mk.blaze ? 1 : Math.min(1,(S.rim-0.12)/0.22);
        label(k, (mk.m>0?"+":"")+mk.m, col, 8, -1, 11.5);
        ctx.restore();
        labelled++;
      }
      liveIdx++;
    }

    // --- the band, smeared along the rim: each order becomes a spectrum
    if(sc.spec && !sc.spec.tooMany){
      var sp = sc.spec, den = Math.max(1e-12, sp.l2-sp.l1);
      for(i=0;i<sp.rows.length;i++){
        var row = sp.rows[i];
        for(var q=0;q<row.pts.length-1;q++){
          var pa = row.pts[q], pb = row.pts[q+1];
          if(!pa || !pb) continue;
          var relb = sp.emax>0 ? Math.sqrt(pa.eff/sp.emax) : 0;
          line(kvec(pa.beta), kvec(pb.beta), ramp((pa.lam-sp.l1)/den),
               1.1+2.8*relb, null, 0.28+0.72*relb);
        }
      }
    }

    // --- the fan arc, once the rim is in focus
    if(S.rim > 0.25 && sc.live > 1 && CAM.rimUsable){
      var a1 = Math.asin(Math.max(-1,Math.min(1,sinBeta(sc.lo))));
      var a2 = Math.asin(Math.max(-1,Math.min(1,sinBeta(sc.hi))));
      var arc=[], N=64;
      for(i=0;i<=N;i++){
        var bb = a1 + (a2-a1)*i/N;
        arc.push([sg*Math.sin(bb)*1.0, sg*Math.cos(bb)*1.0, cg]);
      }
      ctx.save(); ctx.globalAlpha = Math.min(1,(S.rim-0.25)/0.25);
      poly(arc, "#ffffff", 1, 0.55);
      var midb = (a1+a2)/2;
      label([sg*Math.sin(midb)*1.0, sg*Math.cos(midb)*1.0, cg],
            sc.fan.toFixed(1)+"° fan", "#e6ecf8", -18, -16, 11.5);
      ctx.restore();
    }

    paintReadout(sc);
    drawStrip(sc);
  }

  // ---- the dispersion strip: where the band lands, order by order -----
  var sv = document.getElementById("strip"), sctx = sv.getContext("2d");
  var host = document.getElementById("striphost");

  function drawStrip(sc){
    var spec = sc.spec;
    if(!spec || spec.tooMany || !spec.rows.length){ host.hidden = true; return; }
    host.hidden = false;

    var w = host.clientWidth, h = 178;
    sv.width = Math.round(w*DPR); sv.height = Math.round(h*DPR);
    sv.style.width = w+"px"; sv.style.height = h+"px";
    sctx.setTransform(DPR,0,0,DPR,0,0);
    sctx.clearRect(0,0,w,h);

    // x axis: beta, fitted to the band with a little air
    var b0=1e9, b1=-1e9, i, j;
    for(i=0;i<spec.rows.length;i++){
      for(j=0;j<spec.rows[i].pts.length;j++){
        var p = spec.rows[i].pts[j];
        if(!p) continue;
        var d = p.beta*DEG;
        if(d<b0) b0=d; if(d>b1) b1=d;
      }
    }
    if(b1-b0 < 1){ b0-=1; b1+=1; }
    var pad = (b1-b0)*0.06; b0-=pad; b1+=pad;
    var L=46, R=w-14, T=26, BOT=h-30;
    function X(bd){ return L + (bd-b0)/(b1-b0)*(R-L); }

    // axis
    sctx.strokeStyle="#26314a"; sctx.lineWidth=1;
    sctx.beginPath(); sctx.moveTo(L,BOT+2); sctx.lineTo(R,BOT+2); sctx.stroke();
    sctx.font='10px "IBM Plex Mono", ui-monospace, monospace';
    sctx.fillStyle="#5d6880"; sctx.textBaseline="top";
    var nTick=5;
    for(i=0;i<=nTick;i++){
      var bd = b0 + (b1-b0)*i/nTick, x = X(bd);
      sctx.strokeStyle="#1b2436";
      sctx.beginPath(); sctx.moveTo(x,T-6); sctx.lineTo(x,BOT+2); sctx.stroke();
      sctx.textAlign = i===0?"left":(i===nTick?"right":"center");
      sctx.fillText(bd.toFixed(bd===Math.round(bd)?0:1)+"°", x, BOT+7);
    }
    sctx.textAlign="left";
    sctx.fillText("β", 14, BOT+7);

    // Lanes go to the strongest orders, then run in order for reading.
    var MAXLANE = 7;
    var ranked = spec.rows.slice().sort(function(p,q){ return q.peak-p.peak; });
    var lanesRows = ranked.slice(0, MAXLANE).sort(function(p,q){ return p.m-q.m; });
    var laneH = Math.max(11, Math.min(15, (BOT-T-24)/lanesRows.length));
    var y = T;
    for(i=0;i<lanesRows.length;i++){
      var row = lanesRows[i];
      sctx.fillStyle = row.peak >= spec.emax*0.5 ? "#8b97b0" : "#5d6880";
      sctx.textAlign="right"; sctx.textBaseline="middle";
      sctx.fillText((row.m>0?"+":"")+row.m, L-7, y+laneH/2);
      drawBand(row, y, laneH-3, spec, 1);
      y += laneH;
    }
    if(spec.rows.length > lanesRows.length){
      sctx.fillStyle="#3f4a60"; sctx.textAlign="right"; sctx.textBaseline="middle";
      sctx.fillText("+"+(spec.rows.length-lanesRows.length)+" weaker", L-7, y+6);
    }

    // the composite: every order drawn into one lane, so overlap IS overlap
    var cy = BOT-15;
    sctx.fillStyle="#0d1420";
    sctx.fillRect(L, cy, R-L, 13);
    sctx.save(); sctx.globalCompositeOperation="lighter";
    for(i=0;i<spec.rows.length;i++) drawBand(spec.rows[i], cy, 13, spec, 0.85);
    sctx.restore();
    sctx.fillStyle="#8b97b0"; sctx.textAlign="right"; sctx.textBaseline="middle";
    sctx.fillText("arc", L-7, cy+6);

    function drawBand(row, yy, hh, spec, alphaScale){
      for(var q=0;q<row.pts.length-1;q++){
        var a=row.pts[q], b=row.pts[q+1];
        if(!a || !b) continue;
        var xa=X(a.beta*DEG), xb=X(b.beta*DEG);
        var u=(a.lam-spec.l1)/Math.max(1e-12, spec.l2-spec.l1);
        var rel = spec.emax>0 ? a.eff/spec.emax : 0;
        sctx.globalAlpha = alphaScale*(0.10 + 0.90*Math.sqrt(rel));
        sctx.fillStyle = ramp(u);
        var x0=Math.min(xa,xb), wdt=Math.max(0.9, Math.abs(xb-xa)+0.6);
        sctx.fillRect(x0, yy, wdt, hh);
      }
      sctx.globalAlpha = 1;
    }

    // legend
    sctx.textAlign="left"; sctx.textBaseline="top"; sctx.fillStyle="#5d6880";
    sctx.fillText(fmt(spec.l1,2)+" nm", L, 6);
    for(i=0;i<60;i++){
      sctx.fillStyle = ramp(i/59);
      sctx.fillRect(L+72+i*1.6, 7, 1.8, 7);
    }
    sctx.fillStyle="#5d6880";
    sctx.fillText(fmt(spec.l2,2)+" nm", L+72+100, 6);
    sctx.textAlign="right";
    sctx.fillText("order overlap: the same β reached by two orders", R, 6);
  }

  // ---- readout -------------------------------------------------------
  function fmt(x,n){return x.toFixed(n==null?2:n);}

  function paintReadout(sc){
    document.getElementById("t-polar").textContent = "0.00°";
    document.getElementById("t-fan").textContent = sc.live>1 ? fmt(sc.fan,1)+"°" : "—";

    var mag = CAM.mag;
    var rv = document.getElementById("reveal");
    var magv = document.getElementById("magv");
    if(CAM.rimUsable){
      rv.classList.remove("off");
      magv.textContent = fmt(CAM.zoom,1)+"×";
      document.getElementById("rim").disabled = false;
      rv.title = "";
    }else{
      rv.classList.add("off");
      magv.textContent = "1.0×";
      document.getElementById("rim").disabled = true;
      rv.title = Math.abs(S.gamma-90)<0.01
        ? "γ = 90°: the rim is the whole scene, so there is nothing to zoom into."
        : "γ = "+fmt(S.gamma,1)+"° already separates the orders.";
    }

    var tb = document.getElementById("obody");
    tb.innerHTML = "";
    var shown = sc.marks.slice(0, 40);
    for(var i=0;i<shown.length;i++){
      var m = shown[i];
      var tr = document.createElement("tr");
      if(!m.prop) tr.className="ev";
      else if(m.blaze) tr.className="bl";
      else if(m.m===0) tr.className="z";
      var col = !m.prop ? "#ff5470" : m.blaze ? "#ffc233" : m.m===0 ? "#95a2bb" : "#4dc4ff";
      var rel = (sc.eff && sc.eff.emax>0 && m.eff!=null) ? m.eff/sc.eff.emax : 0;
      tr.innerHTML =
        '<td><span class="swatch" style="background:'+col+'"></span>'+(m.m>0?"+":"")+m.m+'</td>'+
        '<td>'+(m.prop ? fmt(m.beta*DEG,2)+"°" : "evan.")+'</td>'+
        '<td>'+(m.eff!=null ? fmt(m.eff,4) : "—")+'</td>'+
        '<td class="bar"><div class="track"><div class="fill" style="width:'+
          (rel*100).toFixed(1)+'%;background:'+col+'"></div></div></td>';
      tb.appendChild(tr);
    }
    var more = document.getElementById("more");
    var bits = [];
    bits.push(sc.live+" propagating");
    if(sc.step>1) bits.push("drawn every "+sc.step+"th");
    if(sc.marks.length>40) bits.push("table truncated at 40");
    if(sc.blaze!=null) bits.push("blaze near m = "+sc.blaze);
    if(sc.spec && sc.spec.tooMany) bits.push("band omitted, "+sc.spec.tooMany+" orders");
    if(sc.eff) bits.push(sc.eff.N+"-point quadrature");
    else if(sc.live>MAX_DRAWN) bits.push("efficiency omitted above "+MAX_DRAWN+" orders");
    more.textContent = bits.join(" · ");

    document.getElementById("t-sum").textContent = sc.eff ? fmt(sc.eff.sum,3) : "—";
    paintProvenance(sc);

    document.getElementById("cap").innerHTML =
      "<b>To scale</b>, bar the patch size. <b>Scalar theory, "+
      (S.coating ? "Au — absolute" : "uncoated — relative to a perfect reflector")+
      "</b>, ray weight E<sub>m</sub>. ΣE is reported, never renormalised.";
  }

  // ---- controls ------------------------------------------------------
  // geometric slider mapping, so the interesting sub-5-degree region is usable
  function geo(v, lo, hi){ return lo*Math.pow(hi/lo, v/1000); }
  function geoInv(x, lo, hi){ return 1000*Math.log(x/lo)/Math.log(hi/lo); }

  var K = {
    gamma:{el:"k-gamma", out:"v-gamma",
      get:function(v){return geo(v,0.25,90);},
      set:function(x){return geoInv(x,0.25,90);},
      fmt:function(x){return fmt(x, x<10?2:1)+"°";}},
    alpha:{el:"k-alpha", out:"v-alpha",
      get:function(v){return v/10;}, set:function(x){return x*10;},
      fmt:function(x){return fmt(x,1)+"°";}},
    lambda:{el:"k-lambda", out:"v-lambda",
      get:function(v){return v/100;}, set:function(x){return x*100;},
      fmt:function(x){return fmt(x,2)+" nm";}},
    band:{el:"k-band", out:"v-band",
      get:function(v){return v/1000;}, set:function(x){return x*1000;},
      fmt:function(x){return x<=0.002 ? "mono" : "±"+fmt(50*x,1)+"%";}},
    period:{el:"k-period", out:"v-period",
      get:function(v){return v/10;}, set:function(x){return x*10;},
      fmt:function(x){return fmt(x,1)+" nm";}},
    blaze:{el:"k-blaze", out:"v-blaze",
      get:function(v){return v/10;}, set:function(x){return x*10;},
      fmt:function(x){return fmt(x,1)+"°";}}
  };

  Object.keys(K).forEach(function(key){
    var spec=K[key], el=document.getElementById(spec.el), out=document.getElementById(spec.out);
    el.value = spec.set(S[key]);
    out.textContent = spec.fmt(S[key]);
    el.addEventListener("input", function(){
      S[key] = spec.get(parseFloat(el.value));
      out.textContent = spec.fmt(S[key]);
      invalidate();
      draw();
    });
  });

  (function(){
    var seg = document.getElementById("coatseg"), out = document.getElementById("v-coat");
    function paint(){
      Array.prototype.forEach.call(seg.children, function(b){
        b.setAttribute("aria-pressed", (b.dataset.v === "1") === S.coating ? "true" : "false");
      });
      out.textContent = S.coating ? "absolute" : "relative";
    }
    Array.prototype.forEach.call(seg.children, function(b){
      b.addEventListener("click", function(){
        S.coating = b.dataset.v === "1";
        paint(); invalidate(); draw();
      });
    });
    paint();
  })();

  var rimEl = document.getElementById("rim");
  rimEl.addEventListener("input", function(){ S.rim = parseFloat(rimEl.value)/1000; draw(); });

  // ---- preset views (PRESET_VIEWS, as camera angles) -------------------
  var VIEWS = [
    {name:"Oblique",       yaw:26.6,  pitch:20.4, rim:0},
    {name:"Down the cone", yaw:0,     pitch:0,    rim:1},
    {name:"Along d̂", yaw:90,    pitch:0,    rim:0},
    {name:"Face n̂",  yaw:0,     pitch:88,   rim:0}
  ];
  var viewsEl = document.getElementById("views"), active = 0;
  VIEWS.forEach(function(v,i){
    var b=document.createElement("button");
    b.textContent=v.name; b.setAttribute("aria-pressed", i===0?"true":"false");
    b.addEventListener("click", function(){ goTo(i); });
    viewsEl.appendChild(b);
  });

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function goTo(i){
    var v=VIEWS[i];
    active=i;
    Array.prototype.forEach.call(viewsEl.children, function(b,j){
      b.setAttribute("aria-pressed", j===i?"true":"false");
    });
    var wantRim = (v.rim && rimMag()>=MIN_RIM_MAG) ? 1 : 0;
    if(reduce){
      S.yaw=v.yaw; S.pitch=v.pitch; S.rim=wantRim; rimEl.value=wantRim*1000; draw(); return;
    }
    var from={yaw:S.yaw, pitch:S.pitch, rim:S.rim};
    var dy = ((v.yaw-from.yaw+540)%360)-180;          // shortest way round
    var t0=performance.now(), DUR=620;
    (function step(now){
      var t=Math.min(1,(now-t0)/DUR);
      var e=t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
      S.yaw = from.yaw + dy*e;
      S.pitch = from.pitch + (v.pitch-from.pitch)*e;
      S.rim = from.rim + (wantRim-from.rim)*e;
      rimEl.value = S.rim*1000;
      draw();
      if(t<1) requestAnimationFrame(step);
    })(t0);
  }

  // ---- orbit ----------------------------------------------------------
  var drag=null;
  stage.addEventListener("pointerdown", function(e){
    if(e.target.closest("#reveal")) return;
    drag={x:e.clientX, y:e.clientY, yaw:S.yaw, pitch:S.pitch};
    stage.classList.add("dragging");
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", function(e){
    if(!drag) return;
    S.yaw = drag.yaw + (e.clientX-drag.x)*0.42;
    S.pitch = Math.max(-88, Math.min(88, drag.pitch + (e.clientY-drag.y)*0.42));
    draw();
  });
  function endDrag(e){
    if(!drag) return;
    drag=null; stage.classList.remove("dragging");
    try{ stage.releasePointerCapture(e.pointerId); }catch(_){}
  }
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);

  stage.addEventListener("wheel", function(e){
    e.preventDefault();
    var next = S.rim + (e.deltaY<0 ? 0.045 : -0.045);
    S.rim = Math.max(0, Math.min(1, next));
    rimEl.value = S.rim*1000;
    draw();
  }, {passive:false});

  window.addEventListener("resize", resize);
  resize();
})();
</script>
