name: ios

# Path-filtered because this is a private repo, and macOS minutes bill at a
# multiplier on one. A change to hypnopompia does not trigger this; run it by
# hand (workflow_dispatch) after one.
on:
  push:
    paths:
      - 'app/**'
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  ios-build:
    name: ios build
    runs-on: macos-latest
    steps:
      # hypnopompia beside this repo, which is package.mjs's second candidate,
      # so the job needs no HYPNOPOMPIA override and exercises the documented
      # flat layout rather than a private one.
      #
      # No website checkout, unlike crunchscope and the games. This page reads
      # nothing from magmacrunch.com -- no shared shell, no site fonts -- and
      # hypnopompia 8a73ddf made the pipeline resolve a website only on first
      # use so that stays true. If this job ever starts failing for want of one,
      # something in app/ has grown a dependency it should not have.
      - name: Check out gratinglab
        uses: actions/checkout@v7
        with:
          path: gratinglab

      - name: Check out hypnopompia beside it
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/hypnopompia
          path: hypnopompia

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Capacitor and the vendored faces
        working-directory: gratinglab/ios
        run: npm ci

      # Split from cap sync so a failure is attributable: this step is the
      # no-op-is-fatal rule, the font vendoring, and the sweep that refuses a
      # bundle reaching outside itself or over the network. "No network
      # connection of any kind" in the store listing is a claim this checks.
      - name: Build the bundle from app/
        working-directory: gratinglab/ios
        run: node package.mjs

      - name: Sync it into the Xcode project
        working-directory: gratinglab/ios
        run: npx cap sync ios

      # A simulator build: no signing, no device. Package.resolved IS committed
      # -- generated on the Mac build host, which is the only place it can be --
      # so this resolves the exact capacitor-swift-pm revision that was verified
      # rather than whatever the version range admits on the day it runs.
      - name: xcodebuild
        working-directory: gratinglab/ios/App/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO build

      - name: The app was produced
        run: test -d "$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/App.app"

      # The bundle that shipped into the app, not the one package.mjs wrote:
      # cap sync copies www/ into App/App/App/public, and a transform that went
      # wrong between the two would not show up anywhere else.
      - name: Nothing in the shipped bundle fetches over the network
        working-directory: gratinglab/ios/App/App/App/public
        run: |
          # This tests what it is named: something that FETCHES. It used to
          # test for any occurrence of a URL, which is a different and larger
          # thing, and the page has since grown two kinds that never load:
          #
          #   * <a href="https://..."> is a user-initiated navigation, not a
          #     resource. The page carries four, to magmacrunch.com and two
          #     repositories. package.mjs unwraps the one on the title screen
          #     and gives the rest to the system browser.
          #   * "http://www.w3.org/1998/Math/MathML" is the MathML namespace,
          #     an identifier. Nothing requests it; a <math> element is inert
          #     without it.
          #
          # The file list was already narrowed once for the same class of false
          # positive: the vendored SIL OFL text names a URL in prose.
          #
          # This mirrors outsideRefs() in hypnopompia's pipeline, which
          # b.sweepSelfContained() already applies inside package.mjs. Both are
          # kept on purpose -- this one does not depend on the pipeline being
          # right, which is the only reason a second guard is worth having.
          if grep -rnE '<(script|link|img|source|video|audio)[^>]*(src|href)[[:space:]]*=[[:space:]]*"https?:' \
               --include='*.html' . ; then
            echo "::error::the shipped bundle loads a resource over the network"
            exit 1
          fi
          if grep -rnE '(url\([[:space:]]*.?|@import[[:space:]]+.?)https?:' \
               --include='*.html' --include='*.css' . ; then
            echo "::error::the shipped bundle pulls a stylesheet or asset over the network"
            exit 1
          fi
          echo "nothing in the shipped bundle fetches over the network"

      # THE ZIP A TESTER INSTALLS, and the manifest describing it. Packaged by
      # the shell rather than here: hypnopompia is already checked out beside
      # this repo, four projects need the identical archive, naming and
      # manifest, and its header explains the ditto-not-zip and
      # read-it-out-of-the-bundle decisions.
      #
      # The artifact is for hypnopompia's deploy-sim.mjs, which puts the zip on
      # an unlisted page on the Pi. That page rather than a release asset
      # because an Actions artifact needs a signed-in GitHub account to download
      # EVEN FROM A PUBLIC REPOSITORY, and a tester with a Mac and no GitHub
      # login is the case it exists for. This repo going public on 2026-09-26
      # does not change that; it only means a release asset is now an option
      # here, as it already was for the two games.
      #
      # Note the build id names THIS repo's sha, the app half; the jamccoy
      # package is not involved in an iOS build and tools/fixture.json is what
      # holds the port to it.
      - name: Package the simulator app
        run: |
          node hypnopompia/tools/package-sim.mjs \
            --app "$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/App.app" \
            --out "$RUNNER_TEMP/sim" \
            --repo gratinglab \
            --name gratinglab

      - name: Upload the simulator app
        uses: actions/upload-artifact@v7
        with:
          name: gratinglab-sim
          path: ${{ runner.temp }}/sim
          if-no-files-found: error
          retention-days: 14
          # Already compressed; compressing it again only costs time.
          compression-level: 0
